<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A basic HTML structure example using semantic HTML elements">
    <meta name="author" content="Paterne Hountondji">
    <title>Basic HTML Structure</title>
</head>
<header>
    <img src="images/basic-logo.png" alt="Site logo" width="128" height="128">
</header>

<nav>
    <ul>
        <li><a href="https://www.google.com">Google</a></li>
        <li><a href="https://www.wikipedia.org">Wikipedia</a></li>
    </ul>
</nav>

<main>
    <h1>Basic HTML Structure</h1>

    <section>
        <h2>Section One</h2>
        <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Esse, vel?</p>
    </section>

    <section>
        <h2>Section Two</h2>
        <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Minus, corporis?</p>
    </section>

    <aside>
        <img
          src="https://content.churchofjesuschrist.org/templesldsorg/bc/Temples/photo-galleries/albuquerque-new-mexico/800x800/albuquerque-temple-lds-137885-wallpaper.jpg"
          width="200" alt="Temple image">
    </aside>
</main>

<footer>
    <p>Paterne Hountondji</p>
</footer>

</body>

</html>
