<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description"
      content="Contact Wild Water Rafting - reach out for reservations, inquiries, and more.">
    <meta name="author" content="Paterne Hountondji">
    <title>Contact Us - Wild Water Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.png" alt="Wild Water Rafting logo" width="200">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <!-- Company Info -->
        <section class="contact-info">
            <h2>Wild Water Rafting Company</h2>
            <p>123 Main River Street</p>
            <p>Fracis palace, Perou</p>
            <p>+1 999 999 9999</p>
            <p>info@wildwaterrafting.com</p>
        </section>

        <!-- Map and Form -->
        <section class="contact-section">

            <!-- Google Map -->
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d255102.6050104223!2d-66.18881791573685!3d-2.5140165999999984!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x921cbda7b9d0e175%3A0x196eb4a74b94bd68!2sFrancis%20Palace%20Hotel!5e0!3m2!1sfr!2sbj!4v1780996710892!5m2!1sfr!2sbj"
                  width="400" height="300" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>"
                width="350" height="350"
                allowfullscreen="" loading="lazy">
                </iframe>
            </div>

            <!-- Contact Form -->
            <form class="contact-form">
                <div class="form-item">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your full name" required>
                </div>

                <div class="form-item">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Your email address"
                      required>
                </div>

                <div class="form-item">
                    <label>Message Purpose</label>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="purpose" value="general"> General Inquiry
                        </label>
                        <label>
                            <input type="radio" name="purpose" value="reservation"> Reservation
                            Question
                        </label>
                        <label>
                            <input type="radio" name="purpose" value="suggestion"> Website
                            Suggestion
                        </label>
                    </div>
                </div>

                <div class="form-item">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4"
                      placeholder="Type here"></textarea>
                </div>

                <div class="form-item">
                    <label>
                        <input type="checkbox" name="newsletter">
                        Please subscribe me to the monthly newsletter
                    </label>
                </div>

                <button type="submit">Get in Touch!</button>
            </form>
        </section>

        <!-- Employee Profiles -->
        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/employee1.jpg" alt="John Smith - Lead Guide">
                    <figcaption>John Smith<br>Lead Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Sarah Jones - Safety Officer">
                    <figcaption>Sarah Jones<br>Safety Officer</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Mike Brown - Trip Coordinator">
                    <figcaption>Mike Brown<br>Trip Coordinator</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Wild Water Rafting - Paterne Hountondji</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook">
            </a>
            <a href="https://twitter.com">
                <img src="images/twitter.png" alt="Twitter">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram">
            </a>
        </nav>
    </footer>

</body>

</html>
